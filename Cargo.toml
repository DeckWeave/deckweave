[workspace]
resolver = "3"
members = ["crates/deckweave-core", "crates/deckweave-n4", "crates/deckweave-platform", "crates/deckweave-services", "apps/desktop/src-tauri"]
default-members = ["crates/deckweave-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
