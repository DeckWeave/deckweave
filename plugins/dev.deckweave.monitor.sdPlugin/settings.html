<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>System Monitor</title>
  <style>
    body {
      font:
        14px 'Segoe UI',
        sans-serif;
      background: #252831;
      color: #eff4fa;
      margin: 20px;
    }
    label {
      display: grid;
      gap: 6px;
      margin: 16px 0;
    }
    [hidden] {
      display: none !important;
    }
    input,
    select {
      font: inherit;
      padding: 8px;
      background: #171e29;
      color: inherit;
      border: 1px solid #566173;
      border-radius: 5px;
    }
    p {
      line-height: 1.5;
      color: #b8c6d8;
    }
  </style>
  <link rel="stylesheet" href="inspector.css" />
  <h2>System Monitor</h2>
  <label
    ><input type="checkbox" id="desktopPanel" /><span id="desktopText"
      >Press to open a desktop panel</span
    ></label
  >
  <label id="adapterField" hidden
    ><span id="adapterText">GPU adapter</span
    ><select id="adapterId">
      <option value="">Busiest adapter</option>
    </select></label
  >
  <p id="diagnostics" role="status"></p>
  <label><span id="labelText">Label</span><input id="label" maxlength="24" /></label
  ><label
    ><span id="languageText">Language</span
    ><select id="language">
      <option value="en">English</option>
      <option value="ru">Русский</option>
    </select></label
  >
  <details class="inspector-help">
    <summary><span class="help-ru">Справка</span><span class="help-en">Help</span></summary>
    <p id="hint">
      Whole-system CPU, used RAM, busiest GPU engine, dedicated VRAM and OS uptime. One shared
      sample every 2 seconds while visible. GPU requires the bundled Windows helper and WDDM 2+. No
      network requests. Changes save automatically.
    </p>
  </details>
  <p id="status" role="status"></p>
  <script src="inspector-theme.js"></script>
  <script>
    let socket,
      context,
      settings = {},
      ready = false,
      ru = false,
      diagnosticTimer;
    const dirty = new Set(),
      el = (id) => document.getElementById(id);
    function show() {
      el('desktopPanel').checked = !!settings.desktopPanel;
      for (const id of ['label', 'language', 'adapterId'])
        if (!dirty.has(id) && document.activeElement !== el(id))
          el(id).value = settings[id] ?? (id === 'language' ? (ru ? 'ru' : 'en') : '');
    }
    window.connectElgatoStreamDeckSocket = (port, uuid, event, info, actionInfo) => {
      DeckWeaveAppearance.apply(JSON.parse(info).deckweave);
      context = uuid;
      ru = JSON.parse(info).application?.language?.startsWith('ru') ?? false;
      document.documentElement.lang = ru ? 'ru' : 'en';
      if (ru) {
        el('desktopText').textContent = 'По нажатию открывать панель на рабочем столе';
        el('labelText').textContent = 'Подпись';
        el('languageText').textContent = 'Язык';
        el('adapterText').textContent = 'Видеоадаптер';
        el('hint').textContent =
          'CPU всей системы, занятая RAM, самый занятый движок GPU, выделенная VRAM и время работы ОС. Общий замер раз в 2 секунды при наличии виджетов. GPU: встроенный Windows-помощник и WDDM 2+. Без сети. Сохраняется автоматически.';
      }
      const action = JSON.parse(actionInfo);
      settings = action.payload?.settings ?? {};
      el('adapterField').hidden = !['gpu', 'gpu-memory'].includes(action.action?.split('.').at(-1));
      show();
      socket = new WebSocket(`ws://127.0.0.1:${port}`);
      DeckWeaveAppearance.subscribe(socket, uuid);
      socket.onopen = () => {
        socket.send(JSON.stringify({ event, uuid }));
        ready = true;
        el('status').textContent = ru ? 'Готово' : 'Ready';
        const inspect = () =>
          socket.send(
            JSON.stringify({
              event: 'sendToPlugin',
              action: action.action,
              context,
              payload: { monitorDiagnostics: true },
            }),
          );
        inspect();
        diagnosticTimer = setInterval(inspect, 2000);
      };
      socket.onmessage = ({ data }) => {
        try {
          const m = JSON.parse(data);
          DeckWeaveAppearance.receive(m);
          if (m.event === 'didReceiveSettings') {
            settings = m.payload.settings ?? {};
            show();
          }
          if (m.event === 'sendToPropertyInspector' && m.payload?.monitor) {
            const info = m.payload.monitor,
              selected = settings.adapterId || '';
            const options = [
              { id: '', name: ru ? 'Самый загруженный' : 'Busiest adapter' },
              ...(info.adapters ?? []),
            ];
            if (selected && !options.some((option) => option.id === selected))
              options.push({
                id: selected,
                name: ru ? 'Адаптер отключён' : 'Adapter disconnected',
              });
            el('adapterId').replaceChildren(
              ...options.map((option) => {
                const item = document.createElement('option');
                item.value = option.id;
                item.textContent =
                  option.index === undefined ? option.name : `GPU ${option.index} · ${option.name}`;
                return item;
              }),
            );
            el('adapterId').value = selected;
            const age = info.sampledAt
              ? `${Math.max(0, Math.round((Date.now() - info.sampledAt) / 1000))} s`
              : '';
            const state =
              {
                ready: ru ? 'Есть данные' : 'Ready',
                warming_up: ru ? 'Первый замер' : 'Warming up',
                unavailable: ru ? 'Нет данных' : 'Unavailable',
                stale: ru ? 'Устарело' : 'Stale',
              }[info.status] || '';
            el('diagnostics').textContent = [state, info.adapter?.name, age, info.reason]
              .filter(Boolean)
              .join(' · ');
          }
        } catch {}
      };
      socket.onclose = () => {
        ready = false;
        clearInterval(diagnosticTimer);
        el('status').textContent = ru ? 'Нет связи' : 'Disconnected';
      };
    };
    for (const id of ['label', 'language', 'adapterId']) {
      el(id).oninput = () => dirty.add(id);
      el(id).onchange = () => {
        if (!ready) return;
        settings = { ...settings, [id]: el(id).value };
        dirty.delete(id);
        socket.send(JSON.stringify({ event: 'setSettings', context, payload: settings }));
      };
    }
    el('desktopPanel').onchange = () => {
      if (!ready) return;
      settings = { ...settings, desktopPanel: el('desktopPanel').checked };
      socket.send(JSON.stringify({ event: 'setSettings', context, payload: settings }));
    };
  </script>
</html>
